spring.application.name=food-delivery-api

# Datasource - SQLite
spring.datasource.url=jdbc:sqlite:food-delivery.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Profile ativo por padrao (dev). Em outros ambientes, sobrescrever via
# SPRING_PROFILES_ACTIVE para nao logar SQL (ver application-dev.properties).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT
jwt.secret=${JWT_SECRET:Zm9vZC1kZWxpdmVyeS1hcGktc2VjcmV0LWtleS1wYXJhLWRlc2Vudm9sdmltZW50bw}
jwt.expiration=86400000

# CORS - origens do frontend autorizadas a chamar a API
cors.origens-permitidas=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
